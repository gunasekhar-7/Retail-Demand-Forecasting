# Production defaults. Paths are relative to the repository root.
seed: 42

data:
  raw_dir: data/raw/m5
  processed_dir: data/processed
  reports_dir: reports
  sales_file: sales_train_evaluation.csv
  calendar_file: calendar.csv
  prices_file: sell_prices.csv
  stores: [CA_1, TX_1]
  depts: [FOODS_3]
  panel_filename: panel.parquet

features:
  horizon: 28
  lags: [7, 14, 28, 364]
  rolling_windows: [7, 28, 56]
  origin_stride_days: 14
  train_window_days: 1095
  max_training_rows: 6000000
  include_events: true
  include_snap: true
  include_price: true

model:
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  num_boost_round: 2000
  early_stopping_rounds: 50
  seed: 42

prophet:
  n_series: 24
  seasonality_mode: multiplicative
  country: US
  include_events: true

eval:
  horizon: 28
  n_folds: 4
  step_days: 28
  bootstrap_reps: 1000
  confidence: 0.95

serve:
  artifacts_dir: artifacts
  host: 127.0.0.1
  port: 8000

inventory:
  lead_time_days: 2
  review_period_days: 1
  service_level: 0.9
  unit_margin_pct: 0.25
  annual_holding_rate: 0.20

synthetic:
  stores: [CA_1, TX_1]
  items_per_store: 3
  days: 760
  start_date: "2011-01-29"
  noise: 0.18
  promo_lift: 0.35
  trend_per_day: 0.0002
