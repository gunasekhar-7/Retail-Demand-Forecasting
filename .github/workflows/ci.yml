name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q -m "not slow"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --frozen
      - name: Build demo artifacts
        run: uv run demand --config configs/base.yaml --config configs/demo.yaml demo
      - name: Build image
        run: docker build --target api -t demand:ci .
      - name: Verify serving image dependency surface
        run: |
          docker run --rm demand:ci python -c '
          import ctypes, importlib.util
          unexpected = [name for name in ("prophet", "streamlit", "duckdb", "httpx") if importlib.util.find_spec(name) is not None]
          assert not unexpected, f"unexpected packages in serving image: {unexpected}"
          ctypes.CDLL("libgomp.so.1")
          import demand.service.app
          import lightgbm
          print(f"serving image ok: lightgbm {lightgbm.__version__}")
          '
      - name: Build and verify dashboard image
        run: |
          docker build --target dashboard -t demand-dashboard:ci .
          docker run --rm demand-dashboard:ci python -c '
          import importlib.util
          assert importlib.util.find_spec("streamlit") is not None, "streamlit missing from dashboard image"
          unexpected = [name for name in ("prophet", "duckdb") if importlib.util.find_spec(name) is not None]
          assert not unexpected, f"unexpected packages in dashboard image: {unexpected}"
          print("dashboard image ok")
          '
      - name: Run hardened container and smoke-test the API
        run: |
          set -euo pipefail
          SERIES=$(uv run python -c "import glob,pandas as pd; print(pd.read_parquet(sorted(glob.glob('artifacts/runs/*/serving_history.parquet'))[0])['series_id'].iloc[0])")
          docker run -d --name demand-ci \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e DEMAND_RATE_LIMIT_PER_MINUTE=600 \
            -p 127.0.0.1:8000:8000 \
            -v "$PWD/artifacts:/app/artifacts:ro" \
            demand:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/live
          curl -fsS http://127.0.0.1:8000/health/ready
          curl -fsS -X POST http://127.0.0.1:8000/forecast \
            -H 'content-type: application/json' \
            -d "{\"series_id\":\"$SERIES\",\"horizon_days\":28}" > /tmp/forecast.json
          uv run python -c "import json; payload=json.load(open('/tmp/forecast.json')); assert len(payload['points']) == 28"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q demand_http_requests_total
      - name: Container logs
        if: failure()
        run: docker logs demand-ci
      - name: Stop container
        if: always()
        run: docker rm -f demand-ci || true

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit --progress-spinner off
