[project]
name = "retail-demand-forecasting"
version = "0.1.0"
description = "Leakage-safe retail demand forecasting: SQL + pandas features, LightGBM vs seasonal-naive vs Prophet, walk-forward validation, FastAPI + Streamlit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.4",
    "pyarrow>=18",
    "PyYAML>=6.0",
    "pydantic>=2.9,<3",
    "lightgbm>=4.7,<5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
pipeline = ["duckdb>=1.4,<3"]
dashboard = ["streamlit>=1.65"]
prophet = ["prophet>=1.5,<2"]
dev = [
    "duckdb>=1.4,<3",
    "streamlit>=1.65",
    "prophet>=1.5,<2",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.9",
    "mypy>=1.13",
    "psutil>=6",
]

[project.scripts]
demand = "demand.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises Prophet or the full pipeline (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error::FutureWarning:demand.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["src/demand"]
omit = ["src/demand/dashboard/app.py"]
